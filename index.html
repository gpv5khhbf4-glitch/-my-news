<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أخباري الخاصة</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #1a1a1a;
            --text-main: #ffffff;
            --text-muted: #888888;
            --gold-accent: #d4af37;
            --gold-dim: rgba(212, 175, 55, 0.15);
        }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
            padding-top: 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        .tabs-container {
            display: flex;
            justify-content: space-around;
            background: rgba(26, 26, 26, 0.7);
            backdrop-filter: blur(12px);
            padding: 8px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: sticky;
            top: 15px;
            z-index: 100;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .tab-btn {
            background: transparent;
            color: var(--text-muted);
            border: none;
            padding: 12px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tab-btn:active {
            transform: scale(0.90);
        }

        .tab-btn.active {
            background-color: var(--gold-accent);
            color: #000;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
        }

        .search-box {
            width: 100%;
            padding: 16px 20px;
            border-radius: 15px;
            border: 1px solid #333;
            background-color: var(--card-bg);
            color: var(--text-main);
            font-size: 18px;
            box-sizing: border-box;
            margin-bottom: 25px;
            transition: all 0.3s ease;
        }
        
        .search-box:focus {
            outline: none;
            border-color: var(--gold-accent);
            box-shadow: 0 0 15px var(--gold-dim);
            transform: translateY(-2px);
        }

        .news-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .news-card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            opacity: 0;
            transform: translateY(20px);
            animation: slideUp 0.5s forwards ease-out;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .news-card:active {
            transform: scale(0.98);
        }

        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .publish-time {
            display: inline-block;
            background: #2a2a2a;
            color: var(--text-muted);
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .news-title {
            margin: 0 0 15px 0;
            font-size: 22px;
            line-height: 1.5;
        }

        .news-title a {
            color: var(--text-main);
            text-decoration: none;
            transition: color 0.2s;
        }

        .news-title a:hover {
            color: var(--gold-accent);
        }

        .read-badge {
            display: inline-flex;
            align-items: center;
            background: var(--gold-dim);
            color: var(--gold-accent);
            padding: 8px 15px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <input type="text" id="searchInput" class="search-box" placeholder="🔍 ابحث في الأخبار..." onkeyup="filterNews()">
    
    <div class="tabs-container">
        <button class="tab-btn active" onclick="changeTab('politics', this)">السياسة</button>
        <button class="tab-btn" onclick="changeTab('tech', this)">التقنية</button>
        <button class="tab-btn" onclick="changeTab('medicines', this)">💊 الأدوية</button>
    </div>

    <div class="news-container" id="newsContainer">
        <p style="text-align:center; color: var(--text-muted); font-size: 18px;">جاري تجهيز الأخبار...</p>
    </div>
</div>

<script>
    let allNews = {};
    let currentCategory = 'politics';

    fetch('news.json')
        .then(response => response.json())
        .then(data => {
            allNews = data;
            renderNews();
        })
        .catch(error => {
            document.getElementById('newsContainer').innerHTML = '<p style="text-align:center; color: var(--text-muted);">جاري تحديث الأخبار... حاول بعد ثواني</p>';
        });

    function changeTab(category, btnElement) {
        currentCategory = category;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');
        document.getElementById('searchInput').value = '';
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function filterNews() {
        renderNews(document.getElementById('searchInput').value);
    }

    function renderNews(searchQuery = '') {
        const container = document.getElementById('newsContainer');
        container.innerHTML = '';

        let articles = allNews[currentCategory] || [];
        
        if (searchQuery) {
            articles = articles.filter(article => 
                article.title.includes(searchQuery) || article.summary.includes(searchQuery)
            );
        }

        if (articles.length === 0) {
            container.innerHTML = '<p style="text-align:center; color: var(--text-muted); font-size: 18px; margin-top: 50px;">لا توجد أخبار حالياً 🤷‍♂️</p>';
            return;
        }

        articles.forEach((article, index) => {
            const card = document.createElement('div');
            card.className = 'news-card';
            card.style.animationDelay = `${index * 0.1}s`;
            
            card.innerHTML = `
                <div class="publish-time">🕒 نُشر: ${article.time}</div>
                <h3 class="news-title"><a href="${article.link}" target="_blank">${article.title}</a></h3>
                <div class="read-badge">${article.read_label || '⚡ قراءة سريعة'}</div>
            `;
            container.appendChild(card);
        });
    }
</script>

</body>
</html>
