<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NewsOS</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container">

    <!-- Header -->

    <header class="header">

        <h1 class="logo">
            News<span>OS</span>
        </h1>

        <p class="last-update">

            آخر تحديث
            <span id="lastUpdate">

                جاري التحقق...

            </span>

        </p>

    </header>

    <!-- Search -->

    <input

        id="searchInput"

        class="search-box"

        type="text"

        placeholder="🔍 ابحث عن أي خبر..."

    >

    <!-- Categories -->

    <div class="tabs">

        <button class="tab active">

            🏛 السياسة

        </button>

        <button class="tab">

            💻 التقنية

        </button>

        <button class="tab">

            💊 الأدوية

        </button>

    </div>

    <!-- Hero -->

    <section class="hero">

        <div class="hero-label">

            🔥 أهم خبر

        </div>

        <h2 class="hero-title">

            جاري تحميل الخبر الرئيسي...

        </h2>

        <p class="hero-summary">

            انتظر قليلاً...

        </p>

    </section>

    <!-- News -->

    <div class="news-list">

    </div>

</div>

<script src="js/app.js"></script>

</body>

</html>
